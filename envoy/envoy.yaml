admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: redis_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 6379
      filter_chains:
        - filters:
            - name: envoy.filters.network.redis_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
                stat_prefix: redis_cluster
                settings:
                  op_timeout: 5s
                  # Envoy сам отрабатывает MOVED и ASK: клиент их не видит
                  # и может быть обычным, не кластерным.
                  enable_redirection: true
                prefix_routes:
                  catch_all_route:
                    cluster: redis_cluster

  clusters:
    - name: redis_cluster
      connect_timeout: 2s
      dns_lookup_family: V4_ONLY
      # Топологию выбирает сам кластер, а не балансировщик Envoy.
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.redis
        typed_config:
          "@type": type.googleapis.com/google.protobuf.Struct
          value:
            # Как часто перечитывать топологию через CLUSTER SLOTS.
            cluster_refresh_rate: 5s
            cluster_refresh_timeout: 3s
            # После скольких редиректов обновлять топологию досрочно.
            # Небольшие значения дают быструю реакцию на failover.
            redirect_refresh_interval: 3s
            redirect_refresh_threshold: 3
            failure_refresh_threshold: 3
      load_assignment:
        cluster_name: redis_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-1
                      port_value: 7000
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-2
                      port_value: 7001
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-3
                      port_value: 7002
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-4
                      port_value: 7003
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-5
                      port_value: 7004
              - endpoint:
                  address:
                    socket_address:
                      address: redis-node-6
                      port_value: 7005

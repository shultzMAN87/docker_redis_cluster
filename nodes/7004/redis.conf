# Нода кластера на порту 7004
#
# Адрес не переопределяется: нода объявляет остальным свой адрес
# в docker-сети. Благодаря этому шина кластера и репликация целиком
# остаются внутри сети и не выходят на хост.
#
# Доступ с хоста обеспечивает Envoy - см. envoy/envoy.yaml и README.

port 7004
bind 0.0.0.0
protected-mode no

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000

# Персистентность выключена намеренно: стенд эфемерный,
# каждый up даёт чистый кластер.
appendonly no
save ""
